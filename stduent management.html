
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Record Management</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f7f9fb}.card{border-radius:12px}</style>
</head>
<body class="p-4">
<div class="container">
<div class="row g-3">
<div class="col-md-5">
<div class="card p-3 shadow-sm">
<h5>Add Student</h5>
<form id="studentForm">
<div class="mb-2"><label>Roll No</label><input type="number" id="roll" class="form-control" required></div>
<div class="mb-2"><label>Name</label><input type="text" id="name" class="form-control" required></div>
<div class="mb-2"><label>Subject</label><input type="text" id="subject" class="form-control" required></div>
<div class="mb-2"><label>Marks</label><input type="number" step="0.01" id="marks" class="form-control" required></div>
<div class="mb-2"><label>Grade</label><input type="text" id="grade" class="form-control" required></div>
<div class="mb-3"><label>Academic Year</label><input type="text" id="year" class="form-control" placeholder="e.g. 2024-2025" required></div>
<div class="d-flex gap-2"><button class="btn btn-primary" type="submit">Add Student</button><button id="clearAll" type="button" class="btn btn-outline-danger">Clear All</button></div>
</form>
<div class="mt-3">
<label>Search by Roll or Name:</label>
<input type="text" id="searchInput" class="form-control" placeholder="Enter roll number or name">
</div>
<div id="status" class="mt-3" style="display:none"></div>
<hr>
<h6>Linked List Structure</h6>
<div id="llInfo" class="small text-muted">Head → ... → NULL</div>
</div>
</div>
<div class="col-md-7">
<div class="card p-3 shadow-sm">
<h5>Student Records</h5>
<div id="records"></div>
</div>
</div>
</div>
</div>
<script>
function Node(roll,name,subject,marks,grade,year){this.roll=roll;this.name=name;this.subject=subject;this.marks=marks;this.grade=grade;this.year=year;this.next=null}
let head=null;const STORAGE_KEY='students_linkedlist_search';
function saveList(){const arr=[];let cur=head;while(cur){arr.push({roll:cur.roll,name:cur.name,subject:cur.subject,marks:cur.marks,grade:cur.grade,year:cur.year});cur=cur.next}localStorage.setItem(STORAGE_KEY,JSON.stringify(arr))}
function loadList(){const raw=localStorage.getItem(STORAGE_KEY);head=null;if(!raw)return;try{const arr=JSON.parse(raw);for(const s of arr)appendNode(new Node(s.roll,s.name,s.subject,s.marks,s.grade,s.year))}catch(e){console.error(e)}}
function appendNode(node){if(!head){head=node;return}let temp=head;while(temp.next)temp=temp.next;temp.next=node}
function addStudent(roll,name,subject,marks,grade,year){if(findByRoll(roll))return{ok:false,msg:'Roll already exists'};const node=new Node(roll,name,subject,marks,grade,year);appendNode(node);saveList();render();return{ok:true,node}}
function findByRoll(roll){let cur=head;while(cur){if(cur.roll===roll)return cur;cur=cur.next}return null}
function deleteByRoll(roll){if(!head)return false;if(head.roll===roll){head=head.next;saveList();render();return true}let prev=head;let cur=head.next;while(cur){if(cur.roll===roll){prev.next=cur.next;saveList();render();return true}prev=cur;cur=cur.next}return false}
function linkedListInfo(){const parts=[];let cur=head;let count=0;while(cur){parts.push(cur.roll);cur=cur.next;count++}return{str:parts.length?'Head → '+parts.join(' → ')+' → NULL':'Head → NULL',count}}
function render(filter=''){const container=document.getElementById('records');container.innerHTML='';if(!head){container.innerHTML='<div class="text-muted">No records yet.</div>';document.getElementById('llInfo').textContent='Head → NULL';return}let cur=head;while(cur){if(filter){const term=filter.toLowerCase();if(!(String(cur.roll).includes(term) || cur.name.toLowerCase().includes(term))){cur=cur.next;continue}}const card=document.createElement('div');card.className='card mb-2';card.innerHTML=`<div class="card-body p-2 d-flex justify-content-between align-items-center"><div><strong>${escapeHtml(cur.name)}</strong> <small class="text-muted">(Roll: ${cur.roll})</small><div class="small text-muted">Subject: ${escapeHtml(cur.subject)} | Marks: ${cur.marks} | Grade: ${escapeHtml(cur.grade)} | Year: ${escapeHtml(cur.year)}</div></div><div><button class="btn btn-sm btn-outline-danger" data-roll="${cur.roll}">Delete</button></div></div>`;container.appendChild(card);cur=cur.next}container.querySelectorAll('button[data-roll]').forEach(btn=>{btn.addEventListener('click',()=>{const r=parseInt(btn.getAttribute('data-roll'),10);if(confirm('Delete record with roll '+r+'?')){deleteByRoll(r);showStatus('Deleted record '+r,'warning')}})});const info=linkedListInfo();document.getElementById('llInfo').textContent=info.str+'  ('+info.count+' nodes)'}
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function showStatus(msg,type='info'){const el=document.getElementById('status');el.style.display='block';el.className='alert alert-'+(type==='info'?'primary':type);el.textContent=msg;setTimeout(()=>{el.style.display='none'},3500)}
const form=document.getElementById('studentForm');form.addEventListener('submit',e=>{e.preventDefault();const roll=parseInt(document.getElementById('roll').value,10);const name=document.getElementById('name').value.trim();const subject=document.getElementById('subject').value.trim();const marks=parseFloat(document.getElementById('marks').value);const grade=document.getElementById('grade').value.trim();const year=document.getElementById('year').value.trim();if(!roll||!name||!subject||isNaN(marks)||!grade||!year){showStatus('Please fill all fields correctly','danger');return}addStudent(roll,name,subject,marks,grade,year);showStatus('Student added successfully','success');form.reset()});
document.getElementById('clearAll').addEventListener('click',()=>{if(!confirm('Clear all student records from local storage?'))return;localStorage.removeItem(STORAGE_KEY);head=null;render();showStatus('All records cleared','warning')});
document.getElementById('searchInput').addEventListener('input',()=>{render(document.getElementById('searchInput').value)});
loadList();render();
</script>
</body>
</html>
